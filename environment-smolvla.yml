# SmolVLA 用の conda 環境(RoboStack の ROS 2 Humble, Python 3.12)。
# lerobot が Python>=3.12 を要求するため apt 版 ROS 2 (Python 3.10) とは別に用意する。
# lerobot 本体は setup.sh が src/SmolVLA/lerobot から editable install する。
name: ros_humble
channels:
  - robostack-staging
  - conda-forge
dependencies:
  - python=3.12
  - ros-humble-ros-base
  - ros-humble-rclpy
  - ros-humble-geometry-msgs
  - ros-humble-sensor-msgs
  - ros-humble-nav-msgs
  - ros-humble-std-msgs
  - ros-humble-launch
  - ros-humble-launch-ros
  - ros-humble-v4l2-camera
  - ros-humble-image-transport
  - ros-humble-camera-info-manager
  - colcon-common-extensions
  - compilers
  - cmake
  - pkg-config
  - pip
  - pip:
      - torch==2.11.0
      - torchvision==0.26.0
      - torch-tensorrt==2.11.0
      - transformers==5.5.4
      - accelerate==1.14.0
      - safetensors==0.8.0
      - num2words==0.5.14
      - numpy==2.2.6
      - opencv-python-headless==4.13.0.92
